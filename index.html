*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5ff;color:#26324a}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;border:1px solid #e2e5ef;border-radius:20px;padding:25px;box-shadow:0 10px 30px #38405f18}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile,.choice,.btn{font:inherit;cursor:pointer}.tile{padding:18px;text-align:left;background:white;border:2px solid #e5e7ef;border-radius:16px}.tile:hover{border-color:#6b5cff}.tile b{display:block;font-size:18px;margin:8px 0}.icon{font-size:28px}.btn{border:0;background:#6758e8;color:white;border-radius:12px;padding:11px 16px;font-weight:700}.btn.alt{background:white;color:#26324a;border:1px solid #d9dce7}.btn:disabled{opacity:.5}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.story{font-size:20px;line-height:1.6;background:#f5f3ff;border-left:5px solid #6758e8;padding:16px;border-radius:12px}.choice{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;background:white;border:2px solid #e0e3ec;border-radius:12px}.choice.selected{border-color:#6758e8;background:#f1efff}.choice.correct{border-color:#179568;background:#e9f8f1}.choice.wrong{border-color:#d7494f;background:#fff0f0}.feedback{margin-top:15px;padding:16px;border-radius:13px;border:2px solid transparent}.feedback.correctBox{background:#e9f8f1;border-color:#179568}.feedback.incorrectBox{background:#fff0f0;border-color:#d7494f}.progress{height:9px;background:#e8eaf1;border-radius:99px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:#6758e8}.stat{background:#f5f3ff;border-radius:14px;padding:15px}.stat strong{display:block;font-size:27px}.tag{display:inline-block;background:#eeeaff;color:#5045bd;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}input{font:inherit;padding:9px;border:1px solid #ccd1dd;border-radius:9px}.pinOverlay{position:fixed;inset:0;background:#17203399;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.pinOverlay.hidden{display:none}.pinDialog{width:min(420px,100%);background:#fff;border-radius:18px;padding:24px}.pinDialog input{width:100%;font-size:22px;letter-spacing:8px;margin:8px 0 12px}.pinError{color:#b42318;font-weight:700;min-height:22px}.pinActions{display:flex;gap:10px;justify-content:flex-end}@media(max-width:560px){.btn{width:100%}}.guidedPrompt{margin:16px 0;padding:16px;background:#fafbff;border:1px solid #e2e5ef;border-radius:14px}.growBox{display:block;width:100%;min-height:60px;resize:none;overflow:hidden;font:inherit;font-size:18px;line-height:1.55;padding:12px;border:2px solid #cfd4e2;border-radius:11px;background:#fff}.growBox:focus{outline:3px solid #dcd7ff;border-color:#6758e8}.clue{display:inline-block;margin-top:7px;padding:5px 9px;background:#eeeaff;color:#5045bd;border-radius:8px;font-size:13px;font-weight:700}.includeList{margin:10px 0 14px;padding:12px 16px 12px 34px;background:#fff8df;border-radius:12px}.modelBox{margin-top:12px;padding:12px;background:#f5f3ff;border-radius:11px}.skillGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-top:12px}.skillCard{padding:12px;background:#fafbff;border:1px solid #e2e5ef;border-radius:12px}.skillCard strong{display:block;font-size:22px}.calmNote{font-size:14px;color:#526078;margin:8px 0}</style></head><body><div class="wrap"><div class="row"><h1>🌱 Growing Wise <small>V2.16.2</small></h1><span id="learner" class="tag"></span></div>
<section id="home" class="card"><h2>Read. Think. Choose. Remember.</h2><p>Situational reading, practical money math, and memory practice.</p><div id="categoryGrid" class="grid"></div><div class="row" style="margin-top:20px"><button id="dashboardButton" class="btn alt">🔒 Parent Dashboard</button><div class="row"><label>Child <select id="childSelect" style="padding:9px;border:1px solid #ccd1dd;border-radius:9px"></select></label><button id="addChildButton" class="btn alt">+ Add child</button></div></div></section>
<section id="play" class="card hidden"><div class="row"><button class="btn alt homeButton">← Home</button><b id="count"></b></div><div class="progress"><div id="progressBar"></div></div><span id="category" class="tag"></span><h2 id="lessonTitle"></h2><div id="story" class="story"></div><h3 id="question"></h3><div id="choices"></div><button id="checkButton" class="btn" disabled>Check my answer</button><div id="feedback"></div></section>
<section id="guidedPlay" class="card hidden"><div class="row"><button class="btn alt guidedHomeButton">← Home</button><b id="guidedCount"></b></div><div class="progress"><div id="guidedProgressBar"></div></div><span id="guidedCategory" class="tag"></span><h2 id="guidedTitle"></h2><div id="guidedStory" class="story"></div><div id="guidedActivity"></div><div id="guidedFeedback"></div></section><section id="dashboard" class="card hidden"><div class="row"><h2>Parent Dashboard</h2><button class="btn alt homeButton">← Home</button></div><div class="row" style="margin-bottom:16px"><label>Viewing child <select id="dashboardChildSelect" style="padding:9px;border:1px solid #ccd1dd;border-radius:9px"></select></label><button id="renameChildButton" class="btn alt">Rename child</button><button id="deleteChildButton" class="btn alt">Delete child</button></div><div id="stats" class="grid"></div><h3>Recent sessions</h3><div id="history"></div><div class="row" style="margin-top:20px"><h3>Question & Answer History</h3><select id="historyFilter" style="padding:9px;border:1px solid #ccd1dd;border-radius:9px"><option value="all">All answers</option><option value="incorrect">Incorrect only</option><option value="memory">Memory only</option><option value="money">Money Smart only</option><option value="personalSafety">Personal Safety only</option><option value="readingResponse">Reading Response only</option><option value="sentenceBuilder">Sentence Builder only</option></select></div><div id="answerHistory"></div><div class="row" style="margin-top:18px"><button id="exportButton" class="btn alt">Export history CSV</button><button id="changePinButton" class="btn alt">Change parent PIN</button><button id="resetButton" class="btn alt">Reset progress</button></div></section></div>
<div id="pinOverlay" class="pinOverlay hidden"><div class="pinDialog"><h2>Parent Dashboard</h2><p>Enter the 4-digit parent PIN.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><div id="pinError" class="pinError"></div><div class="pinActions"><button id="pinCancelButton" class="btn alt">Cancel</button><button id="pinUnlockButton" class="btn">Unlock Dashboard</button></div></div></div><script>var LESSONS=[{"cat":"Money Smart","title":"Grocery Change","story":"Maya buys milk for $4, bread for $3, and apples for $5. She pays with a $20 bill.","question":"How much change should Maya receive?","choices":["$6","$8","$12"],"answer":1,"explain":"The groceries cost $12. $20 minus $12 equals $8.","recall":"What fruit did Maya buy?","recallAnswer":"Apples","id":1,"acceptedAnswers":["apple","apples","fruit"],"scenarioGroup":"grocery-three-items-change"},{"cat":"Money Smart","title":"Incorrect Change","story":"Noah buys a toy for $12 and pays with $20. The cashier gives him $6 back.","question":"What should Noah do?","choices":["Leave without checking","Politely explain that the change should be $8","Keep quiet because the cashier is busy"],"answer":1,"explain":"The correct change is $8. It is responsible to explain the mistake politely.","recall":"How much did the toy cost?","recallAnswer":"$12","id":2,"acceptedAnswers":["12","12 dollars","twelve dollars"],"scenarioGroup":"incorrect-change-honesty"},{"cat":"Money Smart","title":"Best Grocery Value","story":"One apple costs $1. A bag of six apples costs $5.","question":"Which choice gives better value?","choices":["Six single apples","The bag of six apples","They cost the same"],"answer":1,"explain":"Six single apples cost $6, while the bag costs $5.","recall":"How many apples are in the bag?","recallAnswer":"Six","id":3,"acceptedAnswers":["6","six"],"scenarioGroup":"apple-value-comparison"},{"cat":"Money Smart","title":"Stay Within Budget","story":"Sofia has $15. A book costs $8, markers cost $5, and candy costs $4.","question":"Can Sofia buy all three items?","choices":["Yes, with $2 left","No, she is $2 short","No, she is $5 short"],"answer":1,"explain":"The total is $17, which is $2 over budget.","recall":"Which item costs $5?","recallAnswer":"Markers","id":4,"acceptedAnswers":["marker","markers"],"scenarioGroup":"budget-three-items"},{"cat":"Money Smart","title":"Savings Goal","story":"Ella wants headphones costing $25. She has saved $12.","question":"How much more does she need?","choices":["$11","$12","$13"],"answer":2,"explain":"$25 minus $12 equals $13.","recall":"What is Ella saving for?","recallAnswer":"Headphones","id":5,"acceptedAnswers":["headphone","headphones"],"scenarioGroup":"savings-headphones"},{"cat":"Money Smart","title":"Grocery Total","story":"A family buys rice for $7, vegetables for $6, and eggs for $5.","question":"What is the total?","choices":["$16","$18","$20"],"answer":1,"explain":"$7 plus $6 plus $5 equals $18.","recall":"Which item costs $6?","recallAnswer":"Vegetables","id":6,"acceptedAnswers":["vegetable","vegetables"],"scenarioGroup":"grocery-rice-vegetables-eggs"},{"cat":"Friendship","title":"The New Student","story":"A new student named Leila sits alone at lunch.","question":"What is the most thoughtful response?","choices":["Ignore her","Invite her to join and respect her answer","Tell her she must play"],"answer":1,"explain":"A friendly invitation helps someone feel welcome.","recall":"What was her name?","recallAnswer":"Leila","id":7,"acceptedAnswers":["leila"],"scenarioGroup":"leila-lunch-friendship"},{"cat":"Friendship","title":"A Difficult Secret","story":"Nora's friend says she is being bullied and is afraid to attend school.","question":"What should Nora do?","choices":["Keep the secret","Tell a trusted adult who can help","Post it online"],"answer":1,"explain":"A safety concern should be shared with a trusted adult.","recall":"Why was Nora's friend afraid?","recallAnswer":"She was being bullied","id":8,"acceptedAnswers":["bullied","being bullied","bullying"],"scenarioGroup":"bullying-trusted-adult"},{"cat":"Confidence","title":"The Difficult Chapter","story":"Maya does not understand a chapter the first time and feels embarrassed.","question":"What is the most helpful next step?","choices":["Pretend she understood","Reread smaller parts and ask a question","Decide she is bad at reading"],"answer":1,"explain":"Rereading and asking questions are strong learning strategies.","recall":"What was Maya reading?","recallAnswer":"A chapter","id":9,"acceptedAnswers":["chapter","book chapter"],"scenarioGroup":"difficult-reading-reread"},{"cat":"Confidence","title":"Speaking in Class","story":"Ellie has an idea but worries her answer might be wrong.","question":"What could Ellie try?","choices":["Never answer","Take a breath and share her thinking","Laugh at another answer"],"answer":1,"explain":"Courage means taking a safe step even when nervous.","recall":"Where was Ellie?","recallAnswer":"In class","id":10,"acceptedAnswers":["class","classroom"],"scenarioGroup":"speaking-in-class-confidence"},{"cat":"Safety","title":"The Online Player","story":"An unknown player asks Mia for her school name and wants a private chat.","question":"What should Mia do?","choices":["Share the school name","Stop, block or report, and tell a trusted adult","Use a nickname and continue"],"answer":1,"explain":"Personal details should not be shared with unknown people.","recall":"What detail did the player request?","recallAnswer":"Her school name","id":11,"acceptedAnswers":["school name","name of school","school"],"scenarioGroup":"unknown-online-school-private-chat"},{"cat":"Safety","title":"A Ride Home","story":"An adult says Maya's parent asked him to drive her home, but her parent never mentioned a change.","question":"What is the safest choice?","choices":["Go because he looks familiar","Stay with known staff and contact her parent","Walk home alone"],"answer":1,"explain":"Maya should verify the change while staying with a trusted adult.","recall":"What did the adult offer?","recallAnswer":"A ride home","id":12,"acceptedAnswers":["ride","ride home","lift home"],"scenarioGroup":"unexpected-ride-home"},{"cat":"Responsibility","title":"The Broken Frame","story":"Chloe knocks over a picture frame. Nobody sees it.","question":"What is the responsible choice?","choices":["Hide it","Tell the truth, apologize, and help safely","Blame the pet"],"answer":1,"explain":"Responsibility includes telling the truth and repairing harm.","recall":"What did Chloe break?","recallAnswer":"A picture frame","id":13,"acceptedAnswers":["frame","picture frame","photo frame"],"scenarioGroup":"broken-frame-honesty"},{"cat":"Responsibility","title":"The Forgotten Chore","story":"Isla agreed to feed the family pet before playing, but she forgot.","question":"What should she do first?","choices":["Finish the game","Pause, feed the pet, and admit she forgot","Blame someone else"],"answer":1,"explain":"Correcting the mistake promptly shows responsibility.","recall":"Which chore did Isla forget?","recallAnswer":"Feeding the pet","id":14,"acceptedAnswers":["feed pet","feeding pet","pet food","feeding the family pet"],"scenarioGroup":"forgotten-pet-chore"},{"cat":"Personal Safety","title":"Family Code Word","story":"At school pickup, an adult says a parent asked for help, but the adult does not know the family code word.","question":"What is the safest response?","choices":["Go because the adult knows the parent name","Stay with school staff and contact the parent","Walk to the parking lot to check"],"answer":1,"explain":"A planned code word and confirmation with trusted staff help verify unexpected pickup changes.","recall":"What did the adult not know?","recallAnswer":"The family code word","id":15,"acceptedAnswers":["code word","family code","family code word"],"scenarioGroup":"family-code-word-pickup"},{"cat":"Personal Safety","title":"Separated at the Store","story":"A child looks up in a busy grocery store and cannot see the family member who was nearby.","question":"What should the child do?","choices":["Leave the store to search outside","Stay in a visible area and ask a store employee or another identified helper for assistance","Hide between shelves"],"answer":1,"explain":"Staying in the public location and seeking an identified helper is safer than leaving or hiding.","recall":"Where did the child become separated?","recallAnswer":"At a grocery store","id":16,"acceptedAnswers":["grocery store","store","supermarket"],"scenarioGroup":"separated-grocery-store"},{"cat":"Personal Safety","title":"The Tricky Gift","story":"An adult offers a gift and asks a child to keep the meeting secret from family.","question":"What is the wisest action?","choices":["Accept and keep the secret","Say no, move to a safe place, and tell a trusted adult","Give a different name and continue talking"],"answer":1,"explain":"Gifts should never be used to pressure a child into secrecy. Moving away and telling a trusted adult is appropriate.","recall":"What was the child asked to keep secret?","recallAnswer":"The meeting","id":17,"acceptedAnswers":["meeting","meetup"],"scenarioGroup":"gift-and-secret-pressure"},{"cat":"Personal Safety","title":"Uncomfortable Conversation","story":"Someone keeps asking personal questions after a child says the questions are uncomfortable.","question":"What can the child do?","choices":["Answer to be polite","Use a clear no, leave, and tell a trusted adult","Ask even more personal questions back"],"answer":1,"explain":"A child may set a clear boundary, leave the situation, and seek help.","recall":"What kind of questions were being asked?","recallAnswer":"Personal questions","id":18,"acceptedAnswers":["personal question","personal questions","private questions"],"scenarioGroup":"personal-question-boundary"},{"cat":"Personal Safety","title":"Unknown Door Visitor","story":"A child is home with an older sibling when an unknown visitor knocks and asks to come inside.","question":"What should the children do?","choices":["Open the door a little","Keep the door locked and contact a trusted adult","Tell the visitor who is home"],"answer":1,"explain":"The door should remain locked, and the children should follow the family safety plan.","recall":"Who was home with the child?","recallAnswer":"An older sibling","id":19,"acceptedAnswers":["sibling","older sibling","brother","sister"],"scenarioGroup":"unknown-door-visitor"},{"cat":"Personal Safety","title":"Emergency Contact","story":"During an activity, a child needs to contact family but the phone battery is dead.","question":"What is the best next step?","choices":["Leave alone to find a charger","Ask the known activity leader or staff member for help contacting family","Borrow a stranger’s phone and walk away privately"],"answer":1,"explain":"A known staff member can help contact family while the child remains in the supervised location.","recall":"What had happened to the phone?","recallAnswer":"The battery was dead","id":20,"acceptedAnswers":["dead battery","battery dead","phone died","no battery"],"scenarioGroup":"dead-phone-emergency-contact"},{"cat":"Personal Safety","title":"Pressure to Go Somewhere","story":"Some older children ask Zara to leave the supervised park area without telling anyone.","question":"What should Zara do?","choices":["Go so nobody calls her scared","Refuse, remain in the supervised area, and tell the responsible adult","Follow at a distance"],"answer":1,"explain":"Zara can refuse pressure and remain where trusted supervision is available.","recall":"Where was Zara asked to leave?","recallAnswer":"The supervised park area","id":21,"acceptedAnswers":["park area","supervised area","park"],"scenarioGroup":"pressure-leave-supervised-area"},{"cat":"Personal Safety","title":"Location Sharing","story":"An online friend asks Ava to send a live location so they can meet after school.","question":"What should Ava do?","choices":["Send it for only five minutes","Do not share the location, stop the conversation, and tell a trusted adult","Share the location of a friend instead"],"answer":1,"explain":"Live location and meeting requests from unknown online contacts should be taken to a trusted adult.","recall":"What information was requested?","recallAnswer":"A live location","id":22,"acceptedAnswers":["location","live location","current location"],"scenarioGroup":"online-live-location"},{"cat":"Personal Safety","title":"A Safety Secret","story":"A friend says someone is making the friend feel unsafe but asks for a promise of silence.","question":"What is the most caring response?","choices":["Promise never to tell","Tell a trusted adult who can help with safety","Ask other children to investigate"],"answer":1,"explain":"Safety concerns should be shared with a trusted adult, even when keeping the secret was requested.","recall":"How did the friend say the situation felt?","recallAnswer":"Unsafe","id":23,"acceptedAnswers":["unsafe","not safe","in danger","danger"],"scenarioGroup":"unsafe-secret-trusted-adult"},{"cat":"Personal Safety","title":"Trusted Help in Public","story":"A child needs help in a library and sees several people nearby.","question":"Which choice is best?","choices":["Leave with the first person who offers","Approach the staffed service desk and explain the problem","Go into an empty room to wait"],"answer":1,"explain":"A staffed public service desk is an identifiable place to request help.","recall":"Where was the child?","recallAnswer":"At a library","id":24,"acceptedAnswers":["library"],"scenarioGroup":"library-trusted-help"},{"cat":"Personal Safety","title":"Photo Request","story":"Someone from a game chat asks a child to send a private photo and not tell anyone.","question":"What should the child do?","choices":["Send a photo without a face","Do not send anything, block or report, and tell a trusted adult","Ask the person to send one first"],"answer":1,"explain":"Private requests and secrecy from online contacts are warning signs. The child should disengage and seek adult support.","recall":"Where did the request arrive?","recallAnswer":"In a game chat","id":25,"acceptedAnswers":["game chat","gaming chat","chat in game"],"scenarioGroup":"game-chat-photo-request"},{"cat":"Personal Safety","title":"Safe Route Change","story":"While walking a familiar route with permission, Mia notices the usual path is blocked.","question":"What should Mia do?","choices":["Take an unknown shortcut","Return to a known safe place and contact a trusted adult","Follow another person without asking"],"answer":1,"explain":"An unexpected route change should be handled through the family plan rather than an unknown shortcut.","recall":"What was blocked?","recallAnswer":"The usual path","id":26,"acceptedAnswers":["path","usual path","regular route","route"],"scenarioGroup":"blocked-route-safety"},{"cat":"Money Smart","title":"One Item Change","story":"🥛 Milk costs $4. Maya pays with $10.","question":"How much change should Maya receive?","choices":["$4","$6","$10"],"answer":1,"explain":"Start at $4 and count up to $10. The change is $6.","recall":"How much did the milk cost?","recallAnswer":"$4","acceptedAnswers":["4","$4","4 dollars"],"id":27,"scenarioGroup":"milk-change-ten"},{"cat":"Money Smart","title":"Two Item Total","story":"🍞 Bread costs $3. 🍎 Apples cost $2.","question":"How much do they cost altogether?","choices":["$4","$5","$6"],"answer":1,"explain":"$3 plus $2 equals $5.","recall":"Which item cost $2?","recallAnswer":"Apples","acceptedAnswers":["apple","apples","fruit"],"id":28,"scenarioGroup":"bread-apples-total"},{"cat":"Money Smart","title":"Can I Afford It?","story":"📘 A notebook costs $6. Ava has $10.","question":"Can Ava afford the notebook?","choices":["Yes","No","Only with another $2"],"answer":0,"explain":"$10 is enough to pay the $6 price.","recall":"How much money did Ava have?","recallAnswer":"$10","acceptedAnswers":["10","$10","10 dollars"],"id":29,"scenarioGroup":"notebook-affordability"},{"cat":"Money Smart","title":"Small Grocery Change","story":"🥛 Milk costs $4. 🍞 Bread costs $3. Maya pays with $10.","question":"How much change should Maya receive?","choices":["$2","$3","$7"],"answer":1,"explain":"First add $4 plus $3 to get $7. Then $10 minus $7 equals $3.","recall":"What two items did Maya buy?","recallAnswer":"Milk and bread","acceptedAnswers":["milk bread","milk and bread","bread and milk"],"id":30,"scenarioGroup":"milk-bread-change-ten"},{"cat":"Money Smart","title":"Count Up for Change","story":"🍌 Bananas cost $6. Noah pays with $10.","question":"How much change should Noah receive?","choices":["$3","$4","$5"],"answer":1,"explain":"Count $7, $8, $9, $10. That is $4 change.","recall":"What food did Noah buy?","recallAnswer":"Bananas","acceptedAnswers":["banana","bananas","fruit"],"id":31,"scenarioGroup":"bananas-change-ten"}];
var GUIDED=[{"id":"rr1","cat":"Reading Response","skill":"Supporting Details","title":"A Seat at the Table","story":"Leila was sitting alone during lunch at a new school. Emma noticed that no one was sitting beside Leila. Emma invited Leila to join the table. Leila accepted and talked with the group about favourite books. By the end of lunch, Leila knew several classmates.","question":"How did Emma help Leila?","clues":["what Emma noticed","what Emma did","what happened afterward"],"required":[["alone","no one"],["invited","asked","join"],["talked","group","classmates","friends"]],"model":"Emma noticed that Leila was sitting alone, so Emma invited Leila to join the table. Afterward, Leila talked with the group and got to know several classmates.","scenarioGroup":"leila-lunch-friendship"},{"id":"rr2","cat":"Reading Response","skill":"Problem & Solution","title":"The Lost Permission Form","story":"Jordan placed a signed permission form inside a blue folder before school. At the classroom door, Jordan could not find the form in the backpack. Jordan paused and remembered using the blue folder. Jordan found the form between two worksheets and handed it to the teacher.","question":"How did Jordan solve the problem?","clues":["what Jordan remembered","where Jordan looked","where the form was found"],"required":[["blue folder","folder"],["checked","looked","searched"],["between","worksheets"]],"model":"Jordan remembered putting the form in the blue folder and checked it carefully. The form was found between two worksheets.","scenarioGroup":"permission-form-blue-folder"},{"id":"rr3","cat":"Reading Response","skill":"Safety Reasoning","title":"The Unexpected Message","story":"Ava received a message from an unknown account. The sender asked which school Ava attended and wanted to continue in a private chat. Ava did not answer. Ava blocked the account and showed the message to a trusted adult.","question":"Why was Ava's response safe?","clues":["what the sender requested","what Ava refused to do","who Ava told"],"required":[["school","private chat"],["did not answer","blocked","refused"],["adult","parent","trusted"]],"model":"The sender asked about Ava's school and requested a private chat. Ava did not answer, blocked the account, and showed the message to a trusted adult.","scenarioGroup":"unknown-online-school-private-chat"},{"id":"rr4","cat":"Reading Response","skill":"Cause & Effect","title":"The Rainy Walk","story":"Kai planned to walk to the community centre. Before leaving, Kai noticed dark clouds and heard thunder. Kai remembered the family storm rule. Kai stayed with the supervised program and left after an adult confirmed it was safe.","question":"Why did Kai wait before leaving?","clues":["the warning signs","the safe choice","when Kai left"],"required":[["clouds","thunder","storm"],["waited","stayed","inside"],["adult","safe"]],"model":"Kai noticed dark clouds and thunder, so Kai stayed inside. Kai left after an adult confirmed it was safe.","scenarioGroup":"thunder-wait-inside"},{"id":"rr5","cat":"Reading Response","skill":"Main Idea","title":"The Shared Supplies","story":"The art group had one box of markers for four students. Two students kept most colours beside them. Priya suggested putting the markers in the middle and taking one colour at a time. The group finished without arguing.","question":"What is the main idea?","clues":["the problem","Priya's solution","the result"],"required":[["markers","colours","share"],["middle","one at a time"],["finished","fair","without arguing"]],"model":"The group was not sharing fairly. Priya suggested putting the markers in the middle and using one colour at a time, so the group finished without arguing.","scenarioGroup":"shared-art-markers"},{"id":"rr6","cat":"Reading Response","skill":"Sequencing","title":"Getting Ready","story":"Maya checked the weather and saw rain in the forecast. Maya placed an umbrella beside the backpack. After breakfast, Maya packed lunch, put on a raincoat, function init(){load();save();var cats=[['Daily Mix','🌈'],['Money Smart','💰'],['Friendship','🤝'],['Confidence','🌟'],['Safety','🛡️'],['Personal Safety','🚦'],['Responsibility','✅'],['Reading Response','📚'],['Sentence Builder','✍️']];cats.forEach(function(c){var b=document.createElement('button');b.className='tile';b.innerHTML='<span class="icon">'+c[1]+'</span><b>'+c[0]+'</b><span>'+(c[0]==='Money Smart'?'Grocery totals, change, budgets and saving':c[0]==='Personal Safety'?'Boundaries, trusted help, family plans and online safety':c[0]==='Reading Response'?'Passage questions with evidence clues':c[0]==='Sentence Builder'?'Full sentences with expanding clue boxes':'Real-life reading and wise-choice practice')+'</span>';b.addEventListener('click',function(){if(c[0]==='Reading Response'||c[0]==='Sentence Builder')startGuided(c[0]);else start(c[0])});el('categoryGrid').appendChild(b)});el('checkButton').addEventListener('click',check);el('dashboardButton').addEventListener('click',openPinDialog);el('pinUnlockButton').addEventListener('click',unlockDashboard);el('pinCancelButton').addEventListener('click',closePinDialog);el('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter')unlockDashboard()});Array.prototype.forEach.call(document.querySelectorAll('.homeButton'),function(b){b.addEventListener('click',function(){show('home')})});Array.prototype.forEach.call(document.querySelectorAll('.guidedHomeButton'),function(b){b.addEventListener('click',function(){show('home')})});el('childSelect').addEventListener('change',function(){state.activeId=this.value;save()});el('addChildButton').addEventListener('click',function(){var name=window.prompt('Enter the child name');if(name===null)return;name=name.trim();if(!name)return;var id='child'+Date.now();state.profiles.push(newProfile(id,name));state.activeId=id;save()});el('dashboardChildSelect').addEventListener('change',function(){state.activeId=this.value;save();dashboard()});el('renameChildButton').addEventListener('click',function(){var p=active(),name=window.prompt('Enter a new name',p.name);if(name===null)return;name=name.trim();if(!name)return;p.name=name;save();dashboard()});el('deleteChildButton').addEventListener('click',function(){if(state.profiles.length===1){window.alert('At least one child profile is required.');return}var p=active();if(!window.confirm('Delete '+p.name+' and all saved progress?'))return;state.profiles=state.profiles.filter(function(x){return x.id!==p.id});state.activeId=state.profiles[0].id;save();dashboard()});el('historyFilter').addEventListener('change',renderAnswerHistory);el('exportButton').addEventListener('click',exportHistory);el('changePinButton').addEventListener('click',function(){var current=window.prompt('Enter current parent PIN');if(current===null)return;if(current!==state.parentPin){window.alert('Incorrect PIN.');return}var next=window.prompt('Enter a new 4-digit PIN');if(next===null)return;if(!/^[0-9]{4}$/.test(next)){window.alert('PIN must contain exactly 4 numbers.');return}state.parentPin=next;save();window.alert('Parent PIN updated.')} );el('resetButton').addEventListener('click',function(){if(confirm('Reset all saved progress for ' + active().name + '?')){var p=active();p.history=[];p.recent=[];p.memoryCorrect=0;p.memoryTotal=0;p.answerHistory=[];p.skillStats={};p.dailySeenDate='';p.dailySeenIds=[];save();dashboard()}})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();</script></body></html>
